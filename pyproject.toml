[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vortex-ai"
version = "0.1.0"
description = "VORTEX AI - voice-driven desktop assistant on a path toward a full agentic personal operating system"
requires-python = ">=3.11"
readme = "README.md"

# Core dependencies split by concern, all pinned to the exact versions verified
# working in this environment (checked via `pip show`, not assumed). Split so a
# future non-Windows or headless environment isn't forced to install Windows-only
# or audio-only packages it can't use.
dependencies = [
    # NumPy 2.x is intentionally avoided - the ONNX wake-word stack currently
    # uses the NumPy 1.x ABI.
    "numpy==1.26.4",
    "psutil==7.2.2",
    "python-dotenv==1.2.2",
    "ollama==0.6.2",
    # Phase 2 (2026-08-16): voice-triggered file delete goes to the Windows
    # Recycle Bin via send2trash instead of a permanent os.remove - a small,
    # well-established package for exactly this, not gated behind an
    # optional extra since file operations are core OS automation, not an
    # add-on subsystem like documents/browser/rag below.
    "send2trash==2.1.0",
]

[project.optional-dependencies]
# Audio I/O, wake word, TTS/STT - everything needed to actually run the voice loop.
voice = [
    "pygame==2.6.1",
    "sounddevice==0.5.5",
    "SpeechRecognition==3.16.1",
    "PyAudio==0.2.14",  # backend SpeechRecognition's Microphone class requires
    "edge-tts==7.2.8",
    "openwakeword==0.6.0",
    "onnxruntime==1.17.3",
    # edge-tts already pulls this in transitively for its own websocket calls;
    # pinned explicitly here too because voice/tts.py now imports it directly
    # (aiohttp.ClientConnectionError is what routes a cloud-TTS failure to the
    # offline fallback below - see _synth's _NETWORK_ERRORS).
    "aiohttp==3.14.3",
]
# Phase 1 offline STT/TTS fallback (faster-whisper + piper-tts), added
# 2026-08-16 - see config.py's offline_fallback_enabled docstring and
# IMPLEMENTED.md's Phase 1 row. Kept OUT of the base `voice` extra and out of
# `all` below, on purpose, for two concrete reasons verified in this
# environment (not assumed):
#   1. Real size/install friction: faster-whisper pulls in ctranslate2 (a
#      bundled CPU inference engine, ~19MB wheel) and av (bundled ffmpeg,
#      ~28MB wheel) on top of itself; piper-tts is another ~34MB wheel -
#      combined, meaningfully more than the rest of the `voice` extra, before
#      either engine has even downloaded its actual model weights (faster-
#      whisper's base.en model is ~141MB on first use; the default piper
#      voice below is tens of MB more), both fetched lazily on first use, not
#      at pip-install time.
#   2. piper-tts (PyPI project "piper-tts", the OHF-voice/piper1-gpl
#      successor to the original Piper project) is GPL-3.0-or-later - a
#      different license than every other dependency in this file, which is
#      worth a user's explicit opt-in rather than being silently pulled in by
#      `voice` or `all`.
# Both prebuilt Windows wheels installed cleanly in this environment with no
# separate build toolchain (confirmed via `pip install`, not assumed) - the
# plan's original by-name mentions (faster-whisper, Piper) turned out to be
# realistically installable on Windows via pip after all.
# VORTEX_OFFLINE_FALLBACK_ENABLED defaults to on regardless of whether this
# extra is installed - without it, stt.py/tts.py's offline paths just log
# "unavailable" and behave exactly as if the kill switch were off.
voice-offline = [
    "faster-whisper==1.2.1",
    "piper-tts==1.7.0",
]
# Tray icon and Windows-specific OS automation (protected-process names, .exe
# app launching, lock/shutdown commands are Windows-only regardless of this
# extra - see docs/CURRENT_STATE.md Phase 2/platform notes).
windows = [
    "pystray==0.19.5",
    "Pillow==12.2.0",
]
# Phase 7: document intelligence (PDF/DOCX/XLSX text extraction).
documents = [
    "pymupdf==1.28.0",
    "python-docx==1.2.0",
    "openpyxl==3.1.5",
    # OCR fallback for scanned/image-only PDF pages (added 2026-08-16, see
    # documents.py's _ocr_available). pytesseract is only the Python wrapper -
    # it still needs the actual Tesseract OCR binary installed separately
    # (not pip-installable; e.g. https://github.com/UB-Mannheim/tesseract/wiki
    # on Windows) and on PATH, or OCR is skipped with a logged warning rather
    # than failing. Pillow is already pulled in by the `windows` extra, but
    # `documents` doesn't depend on `windows`, so it's listed here too.
    "pytesseract==0.3.13",
    "Pillow==12.2.0",
]
# Phase 3: browser automation. After installing, also run:
#   python -m playwright install chromium
browser = [
    "playwright==1.62.0",
]
# Phase 5: RAG - requires PostgreSQL and Qdrant running locally (see README).
rag = [
    "psycopg2-binary==2.9.12",
    "qdrant-client==1.18.0",
    # Sparse (BM25) half of hybrid dense+sparse retrieval - see requirements.txt's
    # comment for why this and not sentence-transformers/torch.
    "rank_bm25==0.2.2",
]
# Only needed to run tools/wakeword/build_hey_vortex.py (retraining the wake
# model) - not needed to run VORTEX itself. Previously undeclared anywhere,
# so a fresh clone's `pip install -r requirements.txt` left this broken
# (see docs/CURRENT_STATE.md Section 3).
wakeword-training = [
    "onnx==1.22.0",
    "imageio-ffmpeg==0.6.0",
    "scikit-learn==1.9.0",
]
# Gmail-backed email: check/summarize unread mail and draft+send replies,
# gated behind the same awaiting_confirmation yes/no flow every other
# destructive/consequential action already uses - VORTEX drafts, you approve,
# nothing sends without an explicit "yes". Requires a one-time OAuth consent
# in a real browser (not something this package can do headlessly) - see
# README's mail setup section for the Google Cloud Console steps.
mail = [
    "google-api-python-client==2.198.0",
    "google-auth-oauthlib==1.4.0",
    "google-auth-httplib2==0.4.1",
]
dev = [
    "pytest==9.1.1",
    # docs/REFACTOR_PLAN.md Step 9: CI lint/type-check. ruff is scoped to
    # Pyflakes + syntax-error rules only (see .github/workflows/ci.yml) -
    # verified clean at these versions on the current codebase before
    # adding them here, not assumed.
    "ruff==0.16.3",
    "mypy==2.3.1",
]
# Everything needed to actually run `python -m src.vortex.main` today.
# Deliberately excludes voice-offline - see that extra's comment above for
# why (size + a differing GPL license); VORTEX runs fine without it, just
# without the offline STT/TTS fallback actually doing anything on a network
# outage. Install it explicitly (`pip install -e .[voice-offline]`) to get that.
all = [
    "vortex-ai[voice,windows,documents,browser,rag,mail]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# docs/REFACTOR_PLAN.md Step 9: registers the `hardware` marker so tests can
# opt out of the default CI run instead of CI having to opt individual tests
# in - anything needing a real microphone, Ollama, or a Windows GUI process
# gets this marker; .github/workflows/ci.yml runs with `-m "not hardware"`.
markers = [
    "hardware: needs a real microphone, Ollama, or a Windows GUI process - skipped by default in CI",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Pyflakes (real correctness bugs: unused imports, undefined names, etc.)
# and syntax errors only - deliberately not pycodestyle (E/W) or import-
# sorting: this codebase has no established formatting convention to
# enforce, and turning those on now would flag ~150 pre-existing lines for
# a stylistic reason, not a bug, which isn't this step's job to fix.
select = ["F", "E9"]
